name: control-gates
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m fr3k_control.pack_audit docs/source-pack/v1.1 --output evidence/pack-audit.json || test $? -eq 2
      - run: python -m fr3k_control.gate control/gates/g0.json --output evidence/g0-result.json || test $? -eq 2
      - name: Verify static pack audit evidence unchanged
        run: git diff --exit-code -- evidence/pack-audit.json
      - name: Verify G0 substantive evidence unchanged and timestamp fresh
        run: python -m fr3k_control.evidence_consistency
